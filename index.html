<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>学能诊断教练</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f4f8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1e40af, #6d28d9);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left h1 { font-size: 17px; font-weight: 700; }
    .header-left p  { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    .btn-new {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-new:active { background: rgba(255,255,255,0.3); }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .bubble-wrap.user  { flex-direction: row-reverse; }
    .bubble-wrap.coach { flex-direction: row; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .avatar.coach-av { background: linear-gradient(135deg, #1e40af, #6d28d9); }
    .avatar.user-av  { background: #e5e7eb; }

    .bubble {
      max-width: 75%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.coach {
      background: white;
      color: #111827;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .bubble.user {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* markdown-lite rendering */
    .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .bubble th, .bubble td { border: 1px solid #d1d5db; padding: 5px 8px; }
    .bubble th { background: #f3f4f6; }
    .bubble strong { font-weight: 600; }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      text-align: center;
      padding: 40px 24px;
      gap: 16px;
    }
    .empty-icon { font-size: 52px; }
    .empty-title { font-size: 18px; font-weight: 600; color: #374151; }
    .empty-desc { font-size: 14px; line-height: 1.7; }

    .example-problems {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      margin-top: 8px;
    }
    .example-btn {
      background: white;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s;
    }
    .example-btn:active { background: #eff6ff; border-color: #93c5fd; }

    .input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      color: #111827;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #2563eb; }
    textarea::placeholder { color: #9ca3af; }

    .btn-send {
      width: 44px;
      height: 44px;
      background: #2563eb;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-send:active { transform: scale(0.93); }
    .btn-send:disabled { background: #d1d5db; cursor: not-allowed; }
    .btn-send svg { width: 20px; height: 20px; fill: white; }

    @media (min-width: 600px) {
      .bubble { max-width: 65%; }
      header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🎯 学能诊断教练</h1>
    <p>个性化问题诊断，真正提升解题能力</p>
  </div>
  <button class="btn-new" onclick="resetChat()">新题目</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">🔍</div>
    <div class="empty-title">发来你的错题</div>
    <div class="empty-desc">
      把题目和你的答案发过来<br>教练会帮你找到卡在哪里
    </div>
    <div class="example-problems">
      <button class="example-btn" onclick="useExample(this)">
        在三棱锥A-BCD中，△ABC和△ABD是边长为2的等边三角形，平面ABC⊥平面ABD，则CD=？（我选了2√2，正确答案是√6）
      </button>
      <button class="example-btn" onclick="useExample(this)">
        已知函数f(x)=x²-2x+3，求f(x)在[0,3]上的最大值。（我求出最大值是3，但答案是6）
      </button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="inputBox" rows="1" placeholder="发来题目或你的问题…"
    oninput="autoResize(this)"
    onkeydown="handleKey(event)"></textarea>
  <button class="btn-send" id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  let messages = [];
  let isLoading = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function useExample(btn) {
    document.getElementById('inputBox').value = btn.textContent.trim();
    autoResize(document.getElementById('inputBox'));
    document.getElementById('inputBox').focus();
  }

  function resetChat() {
    messages = [];
    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">发来你的错题</div>
        <div class="empty-desc">
          把题目和你的答案发过来<br>教练会帮你找到卡在哪里
        </div>
        <div class="example-problems">
          <button class="example-btn" onclick="useExample(this)">
            在三棱锥A-BCD中，△ABC和△ABD是边长为2的等边三角形，平面ABC⊥平面ABD，则CD=？（我选了2√2，正确答案是√6）
          </button>
          <button class="example-btn" onclick="useExample(this)">
            已知函数f(x)=x²-2x+3，求f(x)在[0,3]上的最大值。（我求出最大值是3，但答案是6）
          </button>
        </div>
      </div>`;
    document.getElementById('inputBox').value = '';
    autoResize(document.getElementById('inputBox'));
  }

  async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text || isLoading) return;

    // hide empty state
    const emptyState = document.getElementById('emptyState');
    if (emptyState) emptyState.remove();

    // add user bubble
    messages.push({ role: 'user', content: text });
    appendBubble('user', text);

    input.value = '';
    autoResize(input);
    setLoading(true);

    // show typing indicator
    const typingId = showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      removeTyping(typingId);

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || '请求失败，请重试');
      }

      const data = await res.json();
      const reply = data.reply;

      messages.push({ role: 'assistant', content: reply });
      appendBubble('coach', reply);

    } catch (e) {
      removeTyping(typingId);
      appendBubble('coach', '⚠️ ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  function appendBubble(role, text) {
    const chatArea = document.getElementById('chatArea');

    const wrap = document.createElement('div');
    wrap.className = `bubble-wrap ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'coach' ? 'coach-av' : 'user-av'}`;
    avatar.textContent = role === 'coach' ? '🎯' : '👤';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.innerHTML = renderText(text);

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function renderText(text) {
    // minimal markdown: bold, tables, line breaks
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\|(.+)\|/g, (match) => {
        // table row
        const cells = match.split('|').slice(1, -1);
        const isHeader = false;
        return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
      })
      .replace(/(<tr>.*<\/tr>\n?)+/gs, (match) => `<table>${match}</table>`)
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const id = 'typing-' + Date.now();

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap coach';
    wrap.id = id;

    const avatar = document.createElement('div');
    avatar.className = 'avatar coach-av';
    avatar.textContent = '🎯';

    const bubble = document.createElement('div');
    bubble.className = 'bubble coach';
    bubble.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatArea.appendChild(wrap);
    chatArea.scrollTop = chatArea.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function setLoading(val) {
    isLoading = val;
    document.getElementById('sendBtn').disabled = val;
    document.getElementById('inputBox').disabled = val;
  }
</script>

</body>
</html>
